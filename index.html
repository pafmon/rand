<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Your Random Link</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #ffffff;

      background:
        radial-gradient(circle at 20% 20%, #6366f1 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #9333ea 0%, transparent 35%),
        #09090b;

      overflow: hidden;
    }

    .glow {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: #7c3aed;
      filter: blur(140px);
      opacity: 0.25;
      pointer-events: none;
    }

    .card {
      position: relative;

      width: 100%;
      max-width: 520px;

      padding: 42px 36px;

      text-align: center;

      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.35);

      animation: fadeIn 0.6s ease;
    }

    .icon {
      width: 64px;
      height: 64px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin: 0 auto 24px;

      border-radius: 18px;

      background: linear-gradient(
        135deg,
        #8b5cf6,
        #6366f1
      );

      box-shadow:
        0 12px 30px rgba(99, 102, 241, 0.35);

      font-size: 28px;
    }

    h1 {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.8px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.6);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .link-box {
      display: none;

      width: 100%;
      padding: 16px 18px;
      margin-bottom: 18px;

      text-align: left;

      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;

      color: rgba(255, 255, 255, 0.75);

      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .button {
      width: 100%;

      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;

      padding: 15px 20px;

      border: 0;
      border-radius: 14px;

      background: #ffffff;
      color: #111827;

      font-size: 15px;
      font-weight: 600;

      text-decoration: none;
      cursor: pointer;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        opacity 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.25);
    }

    .button:active {
      transform: translateY(0);
    }

    .loader {
      width: 32px;
      height: 32px;

      margin: 10px auto;

      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #ffffff;
      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    .error {
      display: none;

      padding: 14px;

      color: #fecaca;

      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 12px;

      font-size: 14px;
    }

    .footer {
      margin-top: 24px;

      color: rgba(255, 255, 255, 0.3);
      font-size: 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 600px) {
      .card {
        padding: 34px 24px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <div class="glow"></div>

  <main class="card">

    <h1>Activity</h1>

    <p class="subtitle">
      Click below to continue.
    </p>

    <div id="loader" class="loader"></div>

    <div id="linkBox" class="link-box"></div>

    <a
      id="openButton"
      class="button"
      target="_blank"
      rel="noopener noreferrer"
    >
      Open link
      <span>→</span>
    </a>

    <div id="error" class="error"></div>

   
  </main>


  <script>

    function showError(message) {

      document.getElementById("loader").style.display = "none";

      const error = document.getElementById("error");

      error.textContent = message;
      error.style.display = "block";

    }


    try {

      /*
        Example:

        ?links=WyJodHRwczovL2dvb2dsZS5jb20iLCJodHRwczovL29wZW5haS5jb20iXQ==
      */

      const params =
        new URLSearchParams(window.location.search);

      const encoded =
        params.get("links");


      if (!encoded) {
        throw new Error("No links were provided.");
      }


      /*
        Base64 -> JSON
      */

      const decoded =
        atob(encoded);

      const links =
        JSON.parse(decoded);


      if (
        !Array.isArray(links) ||
        links.length === 0
      ) {
        throw new Error("No links are available.");
      }


      /*
        Only allow HTTP / HTTPS URLs
      */

      const validLinks =
        links.filter(link => {

          try {

            const url =
              new URL(link);

            return (
              url.protocol === "http:" ||
              url.protocol === "https:"
            );

          } catch {

            return false;

          }

        });


      if (validLinks.length === 0) {
        throw new Error("No valid links are available.");
      }


      /*
        Select random link
      */

      const randomLink =
        validLinks[
          Math.floor(
            Math.random() * validLinks.length
          )
        ];


      /*
        Display result
      */

      const loader =
        document.getElementById("loader");

      const linkBox =
        document.getElementById("linkBox");

      const button =
        document.getElementById("openButton");


      linkBox.textContent =
        randomLink;

      button.href =
        randomLink;


      /*
        Small delay only for visual effect
      */

      setTimeout(() => {

        loader.style.display =
          "none";

        linkBox.style.display =
          "block";

        button.style.display =
          "flex";

      }, 500);


    } catch (error) {

      showError(
        error.message ||
        "Something went wrong."
      );

    }

  </script>

</body>
</html>
